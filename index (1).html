<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Jarvis</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0d12; color:#e8ecf3; font-family: system-ui, sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  #stage { flex:0 0 auto; display:flex; justify-content:center; padding:10px 10px 0; }
  canvas { width:100%; max-width:520px; border-radius:18px; box-shadow:0 8px 40px #0008; }
  #status { text-align:center; font-size:13px; color:#8b93a7; padding:6px; min-height:28px; }
  #log { flex:1 1 auto; overflow-y:auto; padding:8px 14px; max-width:720px; width:100%; margin:0 auto; }
  .msg { margin:6px 0; padding:8px 12px; border-radius:12px; max-width:88%; line-height:1.35; }
  .me { background:#1f6feb; margin-left:auto; }
  .ai { background:#1a1f2b; }
  #bar { display:flex; gap:8px; padding:10px; max-width:720px; width:100%; margin:0 auto;
         padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:24px; border:1px solid #2a3142;
          background:#141926; color:inherit; font-size:16px; }
  button { border:0; border-radius:24px; padding:0 16px; background:#2b3550; color:inherit;
           font-size:18px; cursor:pointer; }
  button.primary { background:#1f6feb; }
  button.rec { background:#d03a3a; }
  .msg img { max-width:100%; border-radius:10px; margin-top:6px; display:block; }
  #panel { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #panel .box { background:#141926; border:1px solid #2a3142; border-radius:16px; padding:18px; width:100%; max-width:440px; }
  #panel h2 { margin:0 0 8px; font-size:18px; }
  #panel p { font-size:13px; color:#9aa3b8; line-height:1.4; margin:6px 0 10px; }
  #panel label { font-size:13px; color:#9aa3b8; display:block; margin-top:10px; }
  #panel input { width:100%; margin-top:4px; border-radius:10px; }
  #panel .row { display:flex; gap:8px; margin-top:14px; }
  #panel button { padding:12px 16px; font-size:15px; border-radius:12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="face" width="640" height="520"></canvas></div>
<div id="status">Toque no microfone (modo conversa) ou digite</div>
<div id="log"></div>
<div id="bar">
  <button id="gear" title="Configuracoes">⚙️</button>
  <button id="mic" title="Falar">🎤</button>
  <input id="txt" placeholder="Digite sua mensagem..." autocomplete="off">
  <button id="send" class="primary">➤</button>
</div>

<div id="panel"><div class="box">
  <h2>Configuracoes do Jarvis</h2>
  <p>Cole abaixo a sua chave gratuita do Google (crie em <b>aistudio.google.com</b> &rarr; Get API key).
     Ela fica guardada <b>so neste aparelho</b> e nao e enviada a ninguem alem do Google.</p>
  <label>Chave de API</label><input id="key" type="password" autocomplete="off" placeholder="AIza...">
  <label>Modelo (deixe <b>auto</b> para o Jarvis escolher sozinho o modelo gratis mais novo)</label><input id="mdl" value="auto">
  <div class="row"><button id="savecfg" class="primary">Salvar</button><button id="closecfg">Fechar</button></div>
</div></div>
<script>
const cv = document.getElementById('face'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const txt = document.getElementById('txt');

// ---------- mouth state ----------
let cur = {open:0, wide:0, round:0};
let tgt = {open:0, wide:0, round:0};
let speaking = false, thinking = false;
let chunkText = '', pos = 0, lastT = performance.now();

function viseme(ch) {
  ch = (ch || ' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if ('a'.includes(ch))  return {open:1.0, wide:0.35, round:0};
  if ('e'.includes(ch))  return {open:0.55, wide:1.0, round:0};
  if ('i'.includes(ch))  return {open:0.28, wide:1.0, round:0};
  if ('o'.includes(ch))  return {open:0.75, wide:0, round:0.8};
  if ('u'.includes(ch))  return {open:0.35, wide:0, round:1.0};
  if ('bmp'.includes(ch)) return {open:0, wide:0, round:0};
  if ('fv'.includes(ch)) return {open:0.12, wide:0.3, round:0};
  if ('wq'.includes(ch)) return {open:0.3, wide:0, round:0.9};
  if (/[a-z]/.test(ch))  return {open:0.28, wide:0.3, round:0};
  return {open:0.04, wide:0, round:0};
}

// ---------- drawing ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw(t) {
  const cx = W / 2, cy = H * 0.56;
  const hw = 150 * (1 + 0.16 * cur.wide - 0.38 * cur.round);
  const h = cur.open * 100;
  const yu = cy - h * 0.38, yl = cy + h * 0.62;
  const L = cx - hw, R = cx + hw;

  // skin
  let g = ctx.createRadialGradient(cx, H * 0.45, 40, cx, H * 0.5, W * 0.8);
  g.addColorStop(0, '#e6ae92'); g.addColorStop(1, '#b57458');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // soft shading (nose shadow, smile lines, chin)
  ctx.save();
  if ('filter' in ctx) ctx.filter = 'blur(14px)';
  ctx.fillStyle = 'rgba(110,50,35,0.28)';
  ctx.beginPath(); ctx.ellipse(cx, 12, 120, 40, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(120,60,45,0.22)'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - hw - 40, cy - 150); ctx.quadraticCurveTo(cx - hw - 70, cy - 40, cx - hw - 25, cy + 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + hw + 40, cy - 150); ctx.quadraticCurveTo(cx + hw + 70, cy - 40, cx + hw + 25, cy + 40); ctx.stroke();
  ctx.fillStyle = 'rgba(100,45,35,0.22)';
  ctx.beginPath(); ctx.ellipse(cx, yl + 82, 90, 22, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,230,210,0.18)';
  ctx.beginPath(); ctx.ellipse(cx, yl + 118, 70, 20, 0, 0, 7); ctx.fill();
  ctx.restore();
  // philtrum
  ctx.save(); if ('filter' in ctx) ctx.filter = 'blur(6px)';
  ctx.strokeStyle = 'rgba(120,60,45,0.25)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(cx - 14, 40); ctx.lineTo(cx - 10, cy - 52);
  ctx.moveTo(cx + 14, 40); ctx.lineTo(cx + 10, cy - 52); ctx.stroke(); ctx.restore();

  // mouth interior
  ctx.save();
  ctx.beginPath(); ctx.moveTo(L, cy);
  ctx.quadraticCurveTo(cx, 2 * yu - cy, R, cy);
  ctx.quadraticCurveTo(cx, 2 * yl - cy, L, cy);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#2a0a0e'; ctx.fillRect(0, 0, W, H);
  // tongue
  let tg = ctx.createRadialGradient(cx, yl - 6, 4, cx, yl - 6, hw * 0.6);
  tg.addColorStop(0, '#dd7a83'); tg.addColorStop(1, '#a3434d');
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.ellipse(cx, yl + 6, hw * 0.52, Math.max(10, h * 0.42), 0, 0, 7); ctx.fill();
  // teeth
  const tgr = ctx.createLinearGradient(0, yu, 0, yu + 40);
  tgr.addColorStop(0, '#d8cdbf'); tgr.addColorStop(0.35, '#fbf7f0'); tgr.addColorStop(1, '#e9dfd2');
  ctx.fillStyle = tgr;
  rr(cx - hw * 0.64, yu - 20, hw * 1.28, 20 + 30 + h * 0.1, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(150,130,110,0.5)'; ctx.lineWidth = 1.5;
  [-0.42, -0.2, 0, 0.2, 0.42].forEach(k => {
    ctx.beginPath(); ctx.moveTo(cx + hw * k, yu); ctx.lineTo(cx + hw * k, yu + 32 + h * 0.1); ctx.stroke();
  });
  if (cur.open > 0.45) {
    ctx.fillStyle = '#efe6da';
    rr(cx - hw * 0.5, yl - 26, hw, 50, 12); ctx.fill();
  }
  // depth shadow at the top of the opening
  const sh = ctx.createLinearGradient(0, yu, 0, yu + 40);
  sh.addColorStop(0, 'rgba(20,0,5,0.45)'); sh.addColorStop(1, 'rgba(20,0,5,0)');
  ctx.fillStyle = sh; ctx.fillRect(L, yu, hw * 2, 40);
  ctx.restore();

  // upper lip
  const uTop = cy - 40 - h * 0.38 + cur.round * 4;
  const lg = ctx.createLinearGradient(0, uTop, 0, cy);
  lg.addColorStop(0, '#b4565d'); lg.addColorStop(1, '#8f3b42');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.moveTo(L, cy);
  ctx.bezierCurveTo(L + hw * 0.25, uTop + 6, cx - hw * 0.22, uTop - 10, cx, uTop + 6);
  ctx.bezierCurveTo(cx + hw * 0.22, uTop - 10, R - hw * 0.25, uTop + 6, R, cy);
  ctx.quadraticCurveTo(cx, 2 * yu - cy, L, cy);
  ctx.closePath(); ctx.fill();

  // lower lip
  const lBot = yl + 46 + cur.round * 6;
  const cp = (lBot - 0.25 * cy) / 0.75;
  const lg2 = ctx.createLinearGradient(0, yl, 0, lBot);
  lg2.addColorStop(0, '#b95a62'); lg2.addColorStop(0.55, '#cc7077'); lg2.addColorStop(1, '#a9484f');
  ctx.fillStyle = lg2;
  ctx.beginPath(); ctx.moveTo(L, cy);
  ctx.quadraticCurveTo(cx, 2 * yl - cy, R, cy);
  ctx.bezierCurveTo(R - hw * 0.12, cp, L + hw * 0.12, cp, L, cy);
  ctx.closePath(); ctx.fill();

  // highlights + lip texture
  ctx.save(); if ('filter' in ctx) ctx.filter = 'blur(5px)';
  ctx.fillStyle = 'rgba(255,225,225,0.28)';
  ctx.beginPath(); ctx.ellipse(cx, yl + 24, hw * 0.34, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,225,225,0.14)';
  ctx.beginPath(); ctx.ellipse(cx - hw * 0.25, uTop + 14, hw * 0.2, 5, -0.15, 0, 7); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.moveTo(L, cy);
  ctx.quadraticCurveTo(cx, 2 * yl - cy, R, cy);
  ctx.bezierCurveTo(R - hw * 0.12, cp, L + hw * 0.12, cp, L, cy);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle = 'rgba(90,25,32,0.13)'; ctx.lineWidth = 1;
  for (let i = -8; i <= 8; i++) {
    ctx.beginPath(); ctx.moveTo(cx + i * hw / 9, yl + 6); ctx.lineTo(cx + i * hw / 9 * 1.04, lBot - 8); ctx.stroke();
  }
  ctx.restore();

  // lip line (contact) + corners
  ctx.strokeStyle = 'rgba(55,12,18,0.75)'; ctx.lineWidth = h < 4 ? 3 : 1.6;
  ctx.beginPath(); ctx.moveTo(L, cy);
  ctx.quadraticCurveTo(cx, 2 * yu - cy, R, cy);
  ctx.stroke();
  ctx.fillStyle = 'rgba(70,20,25,0.5)';
  ctx.beginPath(); ctx.arc(L, cy, 4, 0, 7); ctx.arc(R, cy, 4, 0, 7); ctx.fill();
}

// ---------- animation loop ----------
function frame(now) {
  const dt = Math.min(64, now - lastT); lastT = now;
  if (speaking) {
    pos += dt * 0.0145;                        // ~14.5 chars/s estimate, resynced by word events
    const ch = chunkText[Math.floor(pos)];
    const v = viseme(ch);
    const jit = 0.85 + 0.3 * Math.random();
    tgt = {open: v.open * jit, wide: v.wide, round: v.round};
  } else if (thinking) {
    tgt = {open: 0.06 + 0.05 * Math.sin(now / 250), wide: 0, round: 0};
  } else {
    tgt = {open: 0.015 + 0.012 * Math.sin(now / 900), wide: 0.1, round: 0};  // breathing
  }
  const k = 1 - Math.pow(0.0006, dt / 1000 * 4);
  for (const key in cur) cur[key] += (tgt[key] - cur[key]) * Math.min(1, k * 1.6);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- speech output ----------
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function cleanForSpeech(s) {
  return s.replace(/[*_`#>~|]/g, '').replace(/\p{Extended_Pictographic}/gu, '')
          .replace(/\s+/g, ' ').trim();
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = cleanForSpeech(text);
  const parts = clean.match(/[^.!?;:\n]+[.!?;:]*/g) || [clean];
  const voice = voices.find(v => v.lang === 'pt-BR') || voices.find(v => v.lang && v.lang.startsWith('pt'));
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = 'pt-BR'; if (voice) u.voice = voice; u.rate = 1.0;
    u.onstart = () => { chunkText = u.text; pos = 0; speaking = true; statusEl.textContent = 'Falando...'; };
    u.onboundary = e => { if (e.charIndex !== undefined) pos = e.charIndex; };
    if (i === parts.length - 1) {
      u.onend = u.onerror = () => { speaking = false; statusEl.textContent = ''; if (autoListen) setTimeout(startListen, 500); };
    }
    speechSynthesis.speak(u);
  });
}

// ---------- chat (calls Google Gemini directly from this device) ----------
const SYSTEM = "Voce e o Jarvis, um assistente pessoal por voz. Responda sempre em portugues do Brasil, " +
  "em frases curtas e naturais para serem FALADAS em voz alta. Nao use markdown, listas, emojis nem simbolos. " +
  "Se o usuario pedir para desenhar, criar ou gerar uma imagem, responda SOMENTE neste formato: " +
  "IMAGEM: <descricao detalhada da imagem, escrita em ingles>";
const history = [];

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) {}
  return '';
}
let apiKey = store('jv_key'), model = store('jv_model') || 'auto';
if (model === 'gemini-2.5-flash') model = 'auto';   // old default, being retired by Google

const panel = document.getElementById('panel');
function openSettings() {
  document.getElementById('key').value = apiKey; document.getElementById('mdl').value = model;
  panel.style.display = 'flex';
}
document.getElementById('gear').onclick = openSettings;
document.getElementById('closecfg').onclick = () => { panel.style.display = 'none'; };
document.getElementById('savecfg').onclick = () => {
  apiKey = document.getElementById('key').value.trim();
  model = document.getElementById('mdl').value.trim() || 'auto'; store('jv_auto', '');
  store('jv_key', apiKey); store('jv_model', model);
  panel.style.display = 'none'; statusEl.textContent = apiKey ? 'Pronto! Pode conversar.' : '';
};
if (!apiKey) openSettings();

function addMsg(role, text, imgUrl) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
  d.textContent = text;
  if (imgUrl) { const im = document.createElement('img'); im.src = imgUrl; im.alt = 'imagem'; d.appendChild(im); }
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  if (imgUrl) im.onload = () => { logEl.scrollTop = logEl.scrollHeight; };
}

const API = 'https://generativelanguage.googleapis.com/v1beta/';

// Google retires old models often, so by default we ask which ones exist and pick one.
async function resolveModel(force) {
  if (model !== 'auto') return model;
  const cached = force ? '' : store('jv_auto');
  if (cached) return cached;
  const r = await fetch(API + 'models?pageSize=1000', {headers: {'x-goog-api-key': apiKey}});
  if (!r.ok) throw new Error(r.status === 400 || r.status === 403 ? 'chave invalida ou sem permissao'
                                                                   : 'nao consegui listar os modelos (erro ' + r.status + ')');
  const data = await r.json();
  const cands = (data.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => { const x = /^models\/gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/.exec(m.name);
                return x ? {id: m.name.slice(7), v: parseFloat(x[1]), lite: !!x[2]} : null; })
    .filter(Boolean);
  const newest = a => a.sort((p, q) => q.v - p.v)[0];
  const best = newest(cands.filter(c => c.lite)) || newest(cands);   // "lite" has the most generous free quota
  const id = best ? best.id : 'gemini-flash-latest';
  store('jv_auto', id);
  return id;
}

async function askGemini(retried) {
  const contents = history.slice(-12).map(m => ({
    role: m.role === 'user' ? 'user' : 'model', parts: [{text: m.content}]
  }));
  const useModel = await resolveModel(!!retried);
  const r = await fetch(API + 'models/' + encodeURIComponent(useModel) + ':generateContent', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-goog-api-key': apiKey},
    body: JSON.stringify({system_instruction: {parts: [{text: SYSTEM}]}, contents})
  });
  if (r.status === 404 && model === 'auto' && !retried) { store('jv_auto', ''); return askGemini(true); }
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok) {
    const why = r.status === 400 || r.status === 403 ? 'chave invalida ou sem permissao'
              : r.status === 429 ? 'limite gratis atingido, tente de novo em instantes'
              : r.status === 404 ? 'modelo nao encontrado (veja a configuracao)' : 'erro ' + r.status;
    throw new Error(why);
  }
  const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const out = parts.map(p => p.text || '').join('').trim();
  if (!out) throw new Error('resposta vazia');
  return out;
}

async function send(text) {
  text = (text || '').trim(); if (!text) return;
  if (!apiKey) { openSettings(); return; }
  addMsg('user', text); history.push({role: 'user', content: text});
  txt.value = ''; thinking = true; statusEl.textContent = 'Pensando...';
  try {
    const reply = await askGemini();
    thinking = false;
    const m = reply.match(/^IMAGEM:\s*([\s\S]+)/i);
    if (m) {
      const desc = m[1].trim();
      const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(desc) + '?width=768&height=768&nologo=true';
      history.push({role: 'assistant', content: '(imagem gerada: ' + desc + ')'});
      addMsg('assistant', 'Aqui esta a sua imagem.', url); speak('Aqui está a sua imagem.');
    } else {
      history.push({role: 'assistant', content: reply});
      addMsg('assistant', reply); speak(reply);
    }
  } catch (e) {
    thinking = false; history.pop();   // forget the message that failed
    statusEl.textContent = 'Erro: ' + (e instanceof TypeError ? 'sem conexao com o Google (internet?)' : e.message);
    if (autoListen) setTimeout(startListen, 1500);
  }
}

document.getElementById('send').onclick = () => send(txt.value);
txt.addEventListener('keydown', e => { if (e.key === 'Enter') send(txt.value); });

// ---------- microphone: hands-free conversation mode (needs HTTPS or localhost) ----------
const micBtn = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, autoListen = false, listening = false;

function startListen() {
  if (!rec || listening || speaking || thinking || !autoListen) return;
  try { rec.start(); listening = true; micBtn.classList.add('rec'); statusEl.textContent = 'Ouvindo...'; } catch (e) {}
}

if (SR && window.isSecureContext) {
  rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = false;
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      autoListen = false; statusEl.textContent = 'Permita o microfone no navegador.';
    }
  };
  rec.onend = () => {
    listening = false; micBtn.classList.remove('rec');
    if (autoListen && !speaking && !thinking) setTimeout(startListen, 400);
  };
  micBtn.title = 'Modo conversa (toque para ligar/desligar)';
  micBtn.onclick = () => {
    if (autoListen) {                       // turn off
      autoListen = false; try { rec.abort(); } catch (e) {}
      speechSynthesis.cancel(); speaking = false; statusEl.textContent = 'Modo conversa desligado';
    } else {                                // turn on
      autoListen = true; speechSynthesis.cancel(); speaking = false; startListen();
    }
  };
} else {
  micBtn.onclick = () => alert('O microfone so funciona quando a pagina e aberta por um endereco https:// (ex.: GitHub Pages). Use o campo de texto por enquanto.');
}
</script>
</body>
</html>
